name: pos_v2_mobile
description: "POS_V2 mobile app (Admin/Staff/Kitchen)"
publish_to: 'none'

version: 1.0.7+2026052901

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  http: ^1.2.0
  socket_io_client: ^3.1.5
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  intl: ^0.20.2

  drift: ^2.20.0
  drift_flutter: ^0.3.0
  path: ^1.9.0
  bonsoir: ^7.1.1
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  http_parser: ^4.1.0
  print_bluetooth_thermal: ^1.1.0
  flutter_blue_plus: ^2.3.8
  permission_handler: ^12.0.3
  app_settings: ^7.0.0
  mobile_scanner: ^7.2.0
  sunmi_printer_plus: ^4.1.0
  device_info_plus: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.20.0
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#18BD3C"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
